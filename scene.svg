<g fill="#F6F0CD" opacity="0.7"><polygon points="240,70 268,250 306,250 262,70"><animate attributeName="points" values="240,70 268,250 306,250 262,70;420,70 448,250 486,250 442,70;240,70 268,250 306,250 262,70" dur="24s" repeatCount="indefinite"/></polygon></g>
<g stroke="#2E7D5B" stroke-width="13" fill="none"><path d="M200 300 Q300 170 400 300"/><path d="M560 305 Q660 180 760 305"/><path d="M900 300 Q990 190 1080 300"/></g>
<rect x="120" y="288" width="960" height="26" fill="#C4D6CD"><animate attributeName="height" values="14;30;14" dur="20s" repeatCount="indefinite"/><animate attributeName="y" values="300;284;300" dur="20s" repeatCount="indefinite"/></rect>
