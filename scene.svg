<g fill="#E8A0B4"><g><ellipse cx="470" cy="330" rx="14" ry="7"/><circle cx="458" cy="322" r="5"/><circle cx="482" cy="322" r="5"/><animateTransform attributeName="transform" type="translate" values="0 0;30 0;30 0;60 0;60 0;0 0" keyTimes="0;0.2;0.45;0.65;0.9;1" dur="18s" repeatCount="indefinite"/></g></g>
