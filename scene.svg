<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Mangrove shore in three bands: still canopy with travelling light, rising channel water with shifting fish and crabs moving sideways in stages, and leaf litter turning once in an eddy">
